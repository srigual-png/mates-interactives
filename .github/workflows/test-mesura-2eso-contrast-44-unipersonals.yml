name: Auditoria contrast 44 grups unipersonals Mesura 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_contrast_44_unipersonals.json'
      - 'scripts/test-mesura-2eso-contrast-44-unipersonals.cjs'
      - '.github/workflows/test-mesura-2eso-contrast-44-unipersonals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar 44 comparacions sense solapament
        run: node scripts/test-mesura-2eso-contrast-44-unipersonals.cjs
