name: Auditoria triàtge pedagògic 7 clústers Mesura 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_triatge_pedagogic_7_clusters_prioritaris.json'
      - 'scripts/test-mesura-2eso-triatge-pedagogic-7-clusters.cjs'
      - '.github/workflows/test-mesura-2eso-triatge-pedagogic-7-clusters.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar traçabilitat de 7 agrupacions pedagògiques
        run: node scripts/test-mesura-2eso-triatge-pedagogic-7-clusters.cjs
