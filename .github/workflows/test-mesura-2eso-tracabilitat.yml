name: Verifica tracabilitat 128 tipus Mesura 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_tracabilitat_128_tipus.json'
      - 'scripts/test-mesura-2eso-tracabilitat.cjs'
      - '.github/workflows/test-mesura-2eso-tracabilitat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprova-tracabilitat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar 128 tipus i referencies
        run: node scripts/test-mesura-2eso-tracabilitat.cjs
