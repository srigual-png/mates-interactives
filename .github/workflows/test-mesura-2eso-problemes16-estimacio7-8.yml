name: Mesura 2n ESO - comparacio i error relatiu B
on:
  pull_request:
    paths:
      - 'scripts/test-mesura-2eso-problemes16-estimacio7-8-aparellades.cjs'
      - '2eso/sentit-mesura.html'
      - '.github/workflows/test-mesura-2eso-problemes16-estimacio7-8.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar 1200 errors relatius i parelles
        run: node scripts/test-mesura-2eso-problemes16-estimacio7-8-aparellades.cjs
