name: Mesura 2n ESO - tres parelles evidencia real
on:
  workflow_dispatch:
jobs:
  independent-oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar 240 exercicis i validar resposta independent
        run: node scripts/test-mesura-2eso-3-parelles-evidencia-real.cjs
