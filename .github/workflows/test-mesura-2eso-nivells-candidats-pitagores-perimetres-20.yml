name: Auditoria nivells candidats Pitagores Perimetres 20 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_nivells_candidats_pitagores_perimetres_20.json'
      - 'scripts/test-mesura-2eso-nivells-candidats-pitagores-perimetres-20.cjs'
      - '.github/workflows/test-mesura-2eso-nivells-candidats-pitagores-perimetres-20.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar 20 propostes de dificultat
        run: node scripts/test-mesura-2eso-nivells-candidats-pitagores-perimetres-20.cjs
