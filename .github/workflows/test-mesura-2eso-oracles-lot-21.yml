name: Auditoria 21 oracles Escales Perimetres Superficies 2n ESO

on:
  pull_request:
    paths:
      - '2eso/sentit-mesura.html'
      - 'scripts/test-mesura-2eso-oracles-lot-21.cjs'
      - '.github/workflows/test-mesura-2eso-oracles-lot-21.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contrastar 21 tipus amb 1050 oracles independents
        run: node scripts/test-mesura-2eso-oracles-lot-21.cjs
