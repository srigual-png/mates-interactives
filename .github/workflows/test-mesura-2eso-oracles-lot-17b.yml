name: Auditoria 17b oracles Mesura 2n ESO

on:
  pull_request:
    paths:
      - '2eso/sentit-mesura.html'
      - 'scripts/test-mesura-2eso-oracles-lot-17b.cjs'
      - '.github/workflows/test-mesura-2eso-oracles-lot-17b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprovar 17 oracles nous, 850 exemples
        run: node scripts/test-mesura-2eso-oracles-lot-17b.cjs
