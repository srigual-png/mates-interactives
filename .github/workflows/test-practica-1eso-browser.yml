name: Test pràctica 1r ESO amb Chromium

on:
  pull_request:
    paths:
      - '1eso/**'
      - 'assets/**'
      - 'scripts/comprova-resultats-practica-1eso.cjs'
      - '.github/workflows/test-practica-1eso-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practica-1eso:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run practice UI test
        env:
          MI_PLAYWRIGHT: playwright
        run: |
          MI_BROWSER="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" \
            node scripts/comprova-resultats-practica-1eso.cjs
