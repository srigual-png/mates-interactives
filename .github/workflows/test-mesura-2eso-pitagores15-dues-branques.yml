name: Mesura 2n ESO - dues branques Pitagores 15
on:
  pull_request:
    paths:
      - 'scripts/test-mesura-2eso-pitagores15-dues-branques.cjs'
      - '2eso/sentit-mesura.html'
      - '.github/workflows/test-mesura-2eso-pitagores15-dues-branques.yml'
  workflow_dispatch:
jobs:
  branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprovar totes dues branques amb 400 instancies
        run: node scripts/test-mesura-2eso-pitagores15-dues-branques.cjs
