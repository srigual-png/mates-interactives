name: Auditoria 24 prioritats codi Mesura 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_24_prioritats_revisio_codi.json'
      - 'scripts/test-mesura-2eso-prioritats-24-codi.cjs'
      - '.github/workflows/test-mesura-2eso-prioritats-24-codi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar 24 branques i ambiguitat del test
        run: node scripts/test-mesura-2eso-prioritats-24-codi.cjs
