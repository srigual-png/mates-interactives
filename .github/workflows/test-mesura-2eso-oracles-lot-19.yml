name: Auditoria 19 oracles nous Mesura 2n ESO

on:
  pull_request:
    paths:
      - '2eso/sentit-mesura.html'
      - 'scripts/test-mesura-2eso-oracles-lot-19.cjs'
      - '.github/workflows/test-mesura-2eso-oracles-lot-19.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprovar oracles independents de 19 tipus i 950 casos
        run: node scripts/test-mesura-2eso-oracles-lot-19.cjs
