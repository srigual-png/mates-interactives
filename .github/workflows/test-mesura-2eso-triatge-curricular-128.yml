name: Auditoria triatge curricular 128 Mesura 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_triatge_curricular_128_sense_quotes.json'
      - 'scripts/test-mesura-2eso-triatge-curricular-128.cjs'
      - '.github/workflows/test-mesura-2eso-triatge-curricular-128.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar els 128 registres i les 24 prioritats
        run: node scripts/test-mesura-2eso-triatge-curricular-128.cjs
