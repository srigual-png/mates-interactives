      - '.github/workflows/test-mesura-2eso-unitats-escales-semantic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar 96 instàncies semàntiques
        run: node scripts/test-mesura-2eso-unitats-escales-semantic.cjs
