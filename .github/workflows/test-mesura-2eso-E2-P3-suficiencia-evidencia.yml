name: Auditoria suficiencia evidencia E2 P3 Mesura 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_E2_P3_suficiencia_evidencia.json'
      - 'scripts/test-mesura-2eso-E2-P3-suficiencia-evidencia.cjs'
      - '.github/workflows/test-mesura-2eso-E2-P3-suficiencia-evidencia.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprovar bloqueig de decisio per manca d'evidencia
        run: node scripts/test-mesura-2eso-E2-P3-suficiencia-evidencia.cjs
