name: Auditoria creuament 131 fitxes 72 agrupacions Mesura 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_creuament_131_fitxes_72_agrupacions.json'
      - 'scripts/test-mesura-2eso-creuament-131-72.cjs'
      - '.github/workflows/test-mesura-2eso-creuament-131-72.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar traçabilitat de 131 fitxes i solapaments
        run: node scripts/test-mesura-2eso-creuament-131-72.cjs
