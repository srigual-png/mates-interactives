name: Mesura 2n ESO - error relatiu i volums comparats
on:
  pull_request:
    paths:
      - 'scripts/test-mesura-2eso-error-relatiu-comparacions-i-volums.cjs'
      - '2eso/sentit-mesura.html'
      - '.github/workflows/test-mesura-2eso-error-relatiu-comparacions-i-volums.yml'
  workflow_dispatch:
jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprovar 600 instancies i dues variants de volum
        run: node scripts/test-mesura-2eso-error-relatiu-comparacions-i-volums.cjs
