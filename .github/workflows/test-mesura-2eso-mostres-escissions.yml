name: Mostres reals escissions Mesura 2n ESO

on:
  pull_request:
    paths:
      - '2eso/sentit-mesura.html'
      - 'docs/auditoria/MI_2ESO_mesura_escissions_prioritaries.json'
      - 'scripts/test-mesura-2eso-mostres-escissions.cjs'
      - '.github/workflows/test-mesura-2eso-mostres-escissions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mostres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar i validar 54 instancies reals
        run: node scripts/test-mesura-2eso-mostres-escissions.cjs
