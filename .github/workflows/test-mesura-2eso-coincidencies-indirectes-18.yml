name: Auditoria coincidencies indirectes codi Mesura 2n ESO

on:
  pull_request:
    paths:
      - '2eso/sentit-mesura.html'
      - 'docs/auditoria/MI_2ESO_mesura_coincidencies_indirectes_codi_18.json'
      - 'scripts/test-mesura-2eso-coincidencies-indirectes-18.cjs'
      - '.github/workflows/test-mesura-2eso-coincidencies-indirectes-18.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar fragments de codi per a 18 tipus
        run: node scripts/test-mesura-2eso-coincidencies-indirectes-18.cjs
