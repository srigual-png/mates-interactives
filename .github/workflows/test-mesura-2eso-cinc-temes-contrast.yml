name: Auditoria transversal cinc temes Mesura 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_cinc_temes_contrast_transversal.json'
      - 'docs/auditoria/MI_2ESO_mesura_*_decisions_*_tipus.json'
      - 'scripts/test-mesura-2eso-cinc-temes-contrast.cjs'
      - '.github/workflows/test-mesura-2eso-cinc-temes-contrast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integritat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar contrast transversal 92 tipus
        run: node scripts/test-mesura-2eso-cinc-temes-contrast.cjs
