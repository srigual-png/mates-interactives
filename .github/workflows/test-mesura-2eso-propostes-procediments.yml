name: Auditoria propostes procediments Mesura 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_propostes_procediments_nous.json'
      - 'docs/auditoria/MI_2ESO_mesura_tracabilitat_128_tipus.json'
      - 'scripts/test-mesura-2eso-propostes-procediments.cjs'
      - '.github/workflows/test-mesura-2eso-propostes-procediments.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprovar exemples calculats i absencia de families declarades
        run: node scripts/test-mesura-2eso-propostes-procediments.cjs
