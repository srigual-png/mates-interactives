name: Auditoria protocol docent Escales Perimetres 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_protocol_docent_escales_perimetres.json'
      - 'scripts/test-mesura-2eso-protocol-docent-escales-perimetres.cjs'
      - '.github/workflows/test-mesura-2eso-protocol-docent-escales-perimetres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprovar tasques de contrast, controls i transferencies
        run: node scripts/test-mesura-2eso-protocol-docent-escales-perimetres.cjs
