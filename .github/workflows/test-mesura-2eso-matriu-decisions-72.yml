name: Auditoria matriu pedagògica 72 agrupacions Mesura 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_matriu_decisio_pedagogica_72_clusters.json'
      - 'scripts/test-mesura-2eso-matriu-decisions-72.cjs'
      - '.github/workflows/test-mesura-2eso-matriu-decisions-72.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar matriu de 72 agrupacions i 129 assignacions
        run: node scripts/test-mesura-2eso-matriu-decisions-72.cjs
