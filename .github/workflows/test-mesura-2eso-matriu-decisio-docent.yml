name: Auditoria matriu decisio docent Mesura 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_matriu_decisio_docent_3_candidates.json'
      - 'scripts/test-mesura-2eso-matriu-decisio-docent.cjs'
      - '.github/workflows/test-mesura-2eso-matriu-decisio-docent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprovar sis demostracions i decisions pendents
        run: node scripts/test-mesura-2eso-matriu-decisio-docent.cjs
