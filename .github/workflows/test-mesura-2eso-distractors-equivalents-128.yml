name: Auditoria distractors equivalents Mesura 2n ESO

on:
  pull_request:
    paths:
      - 'scripts/test-mesura-2eso-distractors-equivalents-128.cjs'
      - '2eso/sentit-mesura.html'
      - '.github/workflows/test-mesura-2eso-distractors-equivalents-128.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Examinar equivalencia numerica i unitats en 7680 exercicis
        run: node scripts/test-mesura-2eso-distractors-equivalents-128.cjs
