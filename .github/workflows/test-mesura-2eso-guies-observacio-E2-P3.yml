name: Auditoria guies observacio E2 P3 Mesura 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_guies_observacio_E2_P3.json'
      - 'docs/auditoria/MI_2ESO_mesura_protocol_docent_escales_perimetres.json'
      - 'scripts/test-mesura-2eso-guies-observacio-E2-P3.cjs'
      - '.github/workflows/test-mesura-2eso-guies-observacio-E2-P3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprovar guies d'observacio E2 i P3
        run: node scripts/test-mesura-2eso-guies-observacio-E2-P3.cjs
