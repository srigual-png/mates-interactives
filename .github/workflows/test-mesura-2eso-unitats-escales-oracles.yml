name: Oracles Unitats i Escales 2n ESO

on:
  pull_request:
    paths:
      - '2eso/sentit-mesura.html'
      - 'scripts/test-mesura-2eso-unitats-escales-oracles.cjs'
      - '.github/workflows/test-mesura-2eso-unitats-escales-oracles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracles-unitats-escales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprovar oracles matemàtics d'Unitats i Escales
        run: node scripts/test-mesura-2eso-unitats-escales-oracles.cjs
