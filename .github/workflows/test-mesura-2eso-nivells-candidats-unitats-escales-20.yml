    paths:
      - 'docs/auditoria/MI_2ESO_mesura_nivells_candidats_unitats_escales_20.json'
      - 'scripts/test-mesura-2eso-nivells-candidats-unitats-escales-20.cjs'
      - '.github/workflows/test-mesura-2eso-nivells-candidats-unitats-escales-20.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar candidats de 20 tipus i no solapament
        run: node scripts/test-mesura-2eso-nivells-candidats-unitats-escales-20.cjs
