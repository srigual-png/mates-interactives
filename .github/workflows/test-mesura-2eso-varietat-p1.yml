name: Validacio varietat Mesura 2n ESO P1

on:
  pull_request:
    paths:
      - '2eso/sentit-mesura.html'
      - 'scripts/test-mesura-2eso-varietat-p1.cjs'
      - '.github/workflows/test-mesura-2eso-varietat-p1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprova-varietat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Node
        run: node --version
      - name: Prova els generadors i oracles matematics
        run: node scripts/test-mesura-2eso-varietat-p1.cjs
