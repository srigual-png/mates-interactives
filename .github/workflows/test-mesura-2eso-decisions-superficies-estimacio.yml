name: Verifica consolidacio completa Mesura 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_superficies_decisions_20_tipus.json'
      - 'docs/auditoria/MI_2ESO_mesura_estimacio_decisions_18_tipus.json'
      - 'scripts/test-mesura-2eso-decisions-superficies-estimacio.cjs'
      - '.github/workflows/test-mesura-2eso-decisions-superficies-estimacio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica-128:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica 38 tipus nous i cobertura global 128 de 128
        run: node scripts/test-mesura-2eso-decisions-superficies-estimacio.cjs
