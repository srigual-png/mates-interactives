name: Auditoria contrast Estimacio 5 11 16

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_contrast_estimacio_5_11_16.json'
      - 'scripts/test-mesura-2eso-contrast-estimacio-5-11-16.cjs'
      - '.github/workflows/test-mesura-2eso-contrast-estimacio-5-11-16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contrast de criteri de precisio i arrodoniments
        run: node scripts/test-mesura-2eso-contrast-estimacio-5-11-16.cjs
