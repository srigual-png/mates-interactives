name: Validacio oracles estimacio i error Mesura 2n ESO

on:
  pull_request:
    paths:
      - '2eso/sentit-mesura.html'
      - 'scripts/test-mesura-2eso-estimacio-oracles.cjs'
      - '.github/workflows/test-mesura-2eso-estimacio-oracles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracles-estimacio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar 64 exercicis reals d'estimacio i error
        run: node scripts/test-mesura-2eso-estimacio-oracles.cjs
