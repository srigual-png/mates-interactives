name: Mesura 2n ESO - cua de 23 vincles
on:
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprovar traçabilitat dels 23 vincles
        run: node scripts/test-mesura-2eso-cua-23-vincles.cjs
