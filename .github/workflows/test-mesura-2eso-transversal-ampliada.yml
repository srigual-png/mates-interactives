name: Validacio transversal ampliada Mesura 2n ESO

on:
  pull_request:
    paths:
      - '2eso/sentit-mesura.html'
      - 'scripts/test-mesura-2eso-transversal-ampliada.cjs'
      - '.github/workflows/test-mesura-2eso-transversal-ampliada.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracles-transversals-ampliats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Executar conversions escales ombres i comparacions
        run: node scripts/test-mesura-2eso-transversal-ampliada.cjs
