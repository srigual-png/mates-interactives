name: Validacio oracles Pitagores Mesura 2n ESO

on:
  pull_request:
    paths:
      - '2eso/sentit-mesura.html'
      - 'scripts/test-mesura-2eso-pitagores-oracles.cjs'
      - '.github/workflows/test-mesura-2eso-pitagores-oracles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracles-pitagores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar 128 exercicis de Pitagores
        run: node scripts/test-mesura-2eso-pitagores-oracles.cjs
