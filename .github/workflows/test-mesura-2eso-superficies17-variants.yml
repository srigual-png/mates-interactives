name: Auditoria variants superficie 17 2n ESO

on:
  pull_request:
    paths:
      - '2eso/sentit-mesura.html'
      - 'assets/js/dificultat-mi.js'
      - 'scripts/test-mesura-2eso-superficies17-variants.cjs'
      - '.github/workflows/test-mesura-2eso-superficies17-variants.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar bases iguals i diferents amb oracle i classificador
        run: node scripts/test-mesura-2eso-superficies17-variants.cjs
