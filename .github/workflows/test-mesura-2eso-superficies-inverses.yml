name: Validacio inverses volums i capacitat Mesura 2n ESO

on:
  pull_request:
    paths:
      - '2eso/sentit-mesura.html'
      - 'scripts/test-mesura-2eso-superficies-inverses.cjs'
      - '.github/workflows/test-mesura-2eso-superficies-inverses.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracles-inverses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar 64 exercicis de volums inversos i capacitats
        run: node scripts/test-mesura-2eso-superficies-inverses.cjs
