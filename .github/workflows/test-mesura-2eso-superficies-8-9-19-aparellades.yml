name: Mesura 2n ESO - tres tasques de cilindre aparellades
on:
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar 1200 exercicis i quatre triplets reals
        run: node scripts/test-mesura-2eso-superficies-8-9-19-aparellades.cjs
