name: Validacio matematica transversal Mesura 2n ESO

on:
  pull_request:
    paths:
      - '2eso/sentit-mesura.html'
      - 'scripts/test-mesura-2eso-transversal.cjs'
      - '.github/workflows/test-mesura-2eso-transversal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracles-transversals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provar quatre procediments compartits entre temes
        run: node scripts/test-mesura-2eso-transversal.cjs
