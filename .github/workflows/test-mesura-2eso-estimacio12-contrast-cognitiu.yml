name: Auditoria estimacio 12 i carrega cognitiva Mesura 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_estimacio12_contrast_cognitiu.json'
      - 'scripts/test-mesura-2eso-estimacio12-contrast-cognitiu.cjs'
      - '.github/workflows/test-mesura-2eso-estimacio12-contrast-cognitiu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comparar intervals d'arrodoniment i tolerancia amb 4 contraexemples
        run: node scripts/test-mesura-2eso-estimacio12-contrast-cognitiu.cjs
