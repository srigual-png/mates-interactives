name: Publish verified static site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Generate catalogue and verify real topic exams
        run: node scripts/genera-examens-cerca.cjs
      - name: Verify topic access, preserved progress and search links
        run: |
          node scripts/comprova-access-estatic.cjs
          node scripts/comprova-analitica-guardes.cjs
          node scripts/comprova-analitica-uniforme.cjs
          node scripts/comprova-access-lliure.cjs
          node scripts/comprova-practica-cercador.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          cp -r assets 1eso 2eso 3eso 4eso _site/
          cp index.html favicon.ico robots.txt sitemap.xml .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
