name: Test correccions Estimacio 1 i 11 2n ESO

on:
  pull_request:
    paths:
      - '2eso/sentit-mesura.html'
      - 'scripts/test-mesura-2eso-estimacio-1-11-correccions.cjs'
      - '.github/workflows/test-mesura-2eso-estimacio-1-11-correccions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar dos generadors corregits i les quatre decisions de precisio
        run: node scripts/test-mesura-2eso-estimacio-1-11-correccions.cjs
