name: Validacio oracles perimetres i arees Mesura 2n ESO

on:
  pull_request:
    paths:
      - '2eso/sentit-mesura.html'
      - 'scripts/test-mesura-2eso-perimetres-oracles.cjs'
      - '.github/workflows/test-mesura-2eso-perimetres-oracles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracles-perimetres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprovar 96 exercicis de perimetres i arees
        run: node scripts/test-mesura-2eso-perimetres-oracles.cjs
