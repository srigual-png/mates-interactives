name: Auditoria nivells candidats Escales Pitagores 20 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_nivells_candidats_escales_pitagores_20.json'
      - 'scripts/test-mesura-2eso-nivells-candidats-escales-pitagores-20.cjs'
      - '.github/workflows/test-mesura-2eso-nivells-candidats-escales-pitagores-20.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar 20 propostes de nivells i no solapament
        run: node scripts/test-mesura-2eso-nivells-candidats-escales-pitagores-20.cjs
