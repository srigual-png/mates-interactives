name: Validacio de variants d'unitats 2n ESO

on:
  pull_request:
    paths:
      - '2eso/sentit-mesura.html'
      - 'assets/js/dificultat-mi.js'
      - 'scripts/test-mesura-2eso-unitats-variants.cjs'
      - '.github/workflows/test-mesura-2eso-unitats-variants.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prova-variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provar les sis conversions i classificacions
        run: node scripts/test-mesura-2eso-unitats-variants.cjs
