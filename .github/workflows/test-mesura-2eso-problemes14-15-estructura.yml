name: Mesura 2n ESO - tanques i socols estructura
on:
  pull_request:
    paths:
      - 'scripts/test-mesura-2eso-problemes14-15-estructura.cjs'
      - '2eso/sentit-mesura.html'
      - '.github/workflows/test-mesura-2eso-problemes14-15-estructura.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar 800 instancies i contrast estructural
        run: node scripts/test-mesura-2eso-problemes14-15-estructura.cjs
