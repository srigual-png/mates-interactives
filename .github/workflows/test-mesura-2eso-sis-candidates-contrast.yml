name: Auditoria sis candidates 12 casos Mesura 2n ESO

on:
  pull_request:
    paths:
      - 'docs/auditoria/MI_2ESO_mesura_sis_candidates_contrast_12_casos.json'
      - 'docs/auditoria/MI_2ESO_mesura_rubrica_propostes.json'
      - 'scripts/test-mesura-2eso-sis-candidates-contrast.cjs'
      - '.github/workflows/test-mesura-2eso-sis-candidates-contrast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcular 12 casos positius negatius i limit
        run: node scripts/test-mesura-2eso-sis-candidates-contrast.cjs
